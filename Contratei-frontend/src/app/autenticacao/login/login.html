<main class="login-page">
  <section class="login-card">
    <a class="brand" routerLink="/" aria-label="CONTRATEI - página inicial">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" fill="currentColor" />
          <path
            d="m5.5 10 6.5-3.5 6.5 3.5-6.5 3.5L5.5 10Z"
            stroke="white"
            stroke-width="1.2"
            stroke-linejoin="round"
          />
          <path
            d="M8.5 11.5v3c2.3 1.8 4.7 1.8 7 0v-3"
            stroke="white"
            stroke-width="1.2"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <span class="brand-name">CONTRATEI</span>
    </a>

    <header class="login-header">
      <p class="eyebrow">SUA JORNADA COMEÇA AQUI</p>
      <h1>Bem-vindo ao<br />CONTRATEI</h1>
      <p class="subtitle">
        Entre para encontrar profissionais e acompanhar suas aulas.
      </p>
    </header>

    <nav class="account-switch" aria-label="Entrar como">
      <button
        type="button"
        class="switch-option"
        [class.active]="tipoConta === 'aluno'"
        [attr.aria-pressed]="tipoConta === 'aluno'"
        (click)="selecionarTipo('aluno')"
      >
        Aluno
      </button>

      <button
        type="button"
        class="switch-option"
        [class.active]="tipoConta === 'profissional'"
        [attr.aria-pressed]="tipoConta === 'profissional'"
        (click)="selecionarTipo('profissional')"
      >
        Profissional
      </button>
    </nav>

    <form #form="ngForm" (ngSubmit)="onSubmit(form)" novalidate>
      <div class="form-field">
        <label for="email">E-mail</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="seu@email.com"
          autocomplete="email"
          required
          email
          #emailInput="ngModel"
        />

        <small
          class="field-error"
          *ngIf="emailInput.invalid && emailInput.touched"
        >
          Informe um e-mail válido.
        </small>
      </div>

      <div class="form-field">
        <label for="senha">Senha</label>
        <input
          id="senha"
          name="senha"
          type="password"
          [(ngModel)]="senha"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required
          #senhaInput="ngModel"
        />

        <small
          class="field-error"
          *ngIf="senhaInput.invalid && senhaInput.touched"
        >
          Informe sua senha.
        </small>
      </div>

      <!--<div class="password-help">
        <a routerLink="/recuperar-senha">Esqueceu sua senha?</a>
      </div>-->

      
      
      <p class="form-error" *ngIf="mensagemErro" role="alert">
        {{ mensagemErro }}
      </p>

      <p class="form-success" *ngIf="mensagemSucesso" role="status">
        {{ mensagemSucesso }}
      </p>

      <button
        class="submit-button"
        type="submit"
        [disabled]="carregando"
      >
        {{ carregando ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <p class="register-link">
      Ainda não tem conta?
      <a
        [routerLink]="
          tipoConta === 'aluno'
            ? '/cadastro/aluno'
            : '/cadastro/profissional'
        "
      >
        Cadastre-se
      </a>
    </p>
  </section>
</main>
