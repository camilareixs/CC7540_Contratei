<main class="register-page">
  <section class="register-card">
    <a class="brand" routerLink="/" aria-label="CONTRATEI - Página inicial">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" fill="currentColor" />
          <path
            d="m5.5 10 6.5-3.5 6.5 3.5-6.5 3.5L5.5 10Z"
            stroke="white"
            stroke-width="1.2"
            stroke-linejoin="round"
          />
          <path
            d="M8.5 11.5v3c2.3 1.8 4.7 1.8 7 0v-3"
            stroke="white"
            stroke-width="1.2"
            stroke-linecap="round"
          />
        </svg>
      </span>
      <span class="brand-name">CONTRATEI</span>
    </a>

    <header class="register-header">
      <p class="eyebrow">SUA JORNADA COMEÇA AQUI</p>
      <h1>Crie sua conta</h1>
      <p class="subtitle">
        Encontre profissionais ou compartilhe seu conhecimento.
      </p>
    </header>

    <nav class="account-switch" aria-label="Tipo de conta">
      <a routerLink="/cadastro/aluno" class="switch-option active" aria-current="page">
        Aluno
      </a>
      <a routerLink="/cadastro/profissional" class="switch-option">
        Profissional
      </a>
    </nav>

    <form #form="ngForm" (ngSubmit)="onSubmit(form)" novalidate>
      <div class="form-field">
        <label for="nome">Nome completo</label>
        <input
          id="nome"
          name="nome"
          type="text"
          [(ngModel)]="nome"
          placeholder="Seu nome completo"
          autocomplete="name"
          required
          minlength="3"
          #nomeInput="ngModel"
        />
        <small class="field-error" *ngIf="nomeInput.invalid && nomeInput.touched">
          Informe seu nome completo.
        </small>
      </div>

      <div class="form-field">
        <label for="email">E-mail</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="seu@email.com"
          autocomplete="email"
          required
          email
          #emailInput="ngModel"
        />
        <small class="field-error" *ngIf="emailInput.invalid && emailInput.touched">
          Informe um e-mail válido.
        </small>
      </div>

      <div class="form-field">
        <label for="senha">Senha</label>
        <input
          id="senha"
          name="senha"
          type="password"
          [(ngModel)]="senha"
          placeholder="Mínimo de 8 caracteres"
          autocomplete="new-password"
          required
          minlength="8"
          #senhaInput="ngModel"
        />
        <small class="field-error" *ngIf="senhaInput.invalid && senhaInput.touched">
          Use pelo menos 8 caracteres.
        </small>
      </div>

      <div class="form-field">
        <label for="confirmarSenha">Confirmar senha</label>
        <input
          id="confirmarSenha"
          name="confirmarSenha"
          type="password"
          [(ngModel)]="confirmarSenha"
          placeholder="Repita sua senha"
          autocomplete="new-password"
          required
        />
      </div>

      <p class="form-error" *ngIf="mensagemErro" role="alert">
        {{ mensagemErro }}
      </p>

      <p class="form-success" *ngIf="mensagemSucesso" role="status">
        {{ mensagemSucesso }}
      </p>

      
      <button
        class="submit-button"
        type="submit"
        [disabled]="carregando"
      >
        {{ carregando ? 'Criando conta...' : 'Criar minha conta' }}
      </button>

    </form>

    <p class="login-link">
      Já tem uma conta?
      <a routerLink="/login">Entre aqui</a>
    </p>
  </section>
</main>
